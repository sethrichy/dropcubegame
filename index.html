<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2eee4">
  <title>Drop Budget - Wants or Needs?</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      color-scheme: light;
      --paper: #f2eee4;
      --ink: #202720;
      --muted: #72766c;
      --line: #d7d3c8;
      --coral: #ee7155;
      --green: #387c58;
      --lime: #d5e96d;
      --mono: 'DM Mono', monospace;
      --sans: 'Space Grotesk', sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#c9c5b9 0.65px, transparent 0.65px);
      background-size: 17px 17px;
      font-family: var(--sans);
    }

    button { font: inherit; }

    .game-shell {
      width: min(1120px, 100% - 48px);
      margin: 0 auto;
      padding: 28px 0 22px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 15px;
      font-weight: 700;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      background: var(--lime);
      border: 1.5px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      transform: rotate(-4deg);
    }

    .brand-mark span {
      width: 12px;
      height: 12px;
      border: 2px solid var(--ink);
      transform: rotate(45deg);
    }

    .edition {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
    }

    .heading-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 17px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 700;
      line-height: .98;
    }

    h1 span { color: var(--coral); }

    .stats {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .55);
    }

    .stat {
      min-width: 82px;
      padding: 8px 13px 7px;
    }

    .stat + .stat { border-left: 1px solid var(--line); }

    .stat-label {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      text-transform: uppercase;
    }

    .stat-value { font-size: 18px; font-weight: 700; }

    .lives { color: var(--coral); letter-spacing: 2px; }

    .board-frame {
      position: relative;
      overflow: hidden;
      border: 1.5px solid var(--ink);
      background: #e8e3d7;
      box-shadow: 6px 6px 0 var(--ink);
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1000 / 590;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(32, 39, 32, .26);
      animation: appear .2s ease-out both;
    }

    .overlay[hidden] { display: none; }

    .dialog {
      width: min(390px, 100%);
      padding: 28px;
      border: 1.5px solid var(--ink);
      background: var(--paper);
      box-shadow: 6px 6px 0 var(--ink);
      text-align: center;
      animation: pop .3s cubic-bezier(.2, .8, .2, 1) both;
    }

    .dialog-tag {
      color: var(--green);
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
    }

    .dialog h2 {
      margin: 9px 0 8px;
      font-size: 30px;
      line-height: 1.05;
    }

    .dialog p {
      margin: 0 auto 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .primary-button {
      min-height: 46px;
      padding: 0 23px;
      border: 1.5px solid var(--ink);
      background: var(--lime);
      box-shadow: 3px 3px 0 var(--ink);
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .12s, box-shadow .12s;
    }

    .primary-button:hover { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .primary-button:focus-visible, .steer-button:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 17px;
    }

    .control-hint {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 12px;
    }

    .key {
      display: inline-grid;
      width: 25px;
      height: 25px;
      place-items: center;
      border: 1px solid #bcb8ad;
      border-bottom-width: 2px;
      background: rgba(255, 255, 255, .55);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 12px;
    }

    .steer-controls { display: flex; gap: 8px; }

    .steer-button {
      display: grid;
      width: 48px;
      height: 42px;
      place-items: center;
      border: 1px solid var(--ink);
      background: rgba(255, 255, 255, .55);
      color: var(--ink);
      font-size: 20px;
      cursor: pointer;
      touch-action: none;
      user-select: none;
    }

    .steer-button:active { background: var(--lime); }

    .footnote {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      text-transform: uppercase;
    }

    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }

    @media (max-width: 620px) {
      .game-shell { width: min(100% - 28px, 520px); padding-top: 15px; }
      .topbar { margin-bottom: 15px; }
      .edition { font-size: 8px; }
      .heading-row { align-items: center; gap: 8px; margin-bottom: 12px; }
      h1 { font-size: clamp(25px, 7vw, 36px); }
      .stat { min-width: 53px; padding: 6px 7px; }
      .stat-label { font-size: 7px; }
      .stat-value { font-size: 15px; }
      .board-frame { box-shadow: 4px 4px 0 var(--ink); }
      .controls { padding-top: 13px; }
      .control-hint { gap: 5px; font-size: 10px; }
      .key { width: 21px; height: 23px; font-size: 10px; }
      .steer-button { width: 44px; height: 40px; }
      .footnote { font-size: 8px; }
      .dialog { padding: 23px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><span></span></span> DROP BUDGET</div>
      <div class="edition">A tiny game about big choices &nbsp; / &nbsp; 01</div>
    </header>

    <section aria-label="Wants or needs sorting game">
      <div class="heading-row">
        <h1>WANTS <span>OR</span> NEEDS<span>?</span></h1>
        <div class="stats" aria-label="Game stats">
          <div class="stat"><span class="stat-label">Sorted</span><span class="stat-value" id="score">00</span></div>
          <div class="stat"><span class="stat-label">Streak</span><span class="stat-value" id="streak">00</span></div>
          <div class="stat"><span class="stat-label">Misses</span><span class="stat-value lives" id="lives">●●●</span></div>
        </div>
      </div>

      <div class="board-frame">
        <canvas id="game" width="1000" height="590" aria-label="A falling purchase cube. Steer left for wants or right for needs."></canvas>
        <div class="overlay" id="overlay">
          <div class="dialog">
            <div class="dialog-tag" id="dialog-tag">Sort smart. Stay sharp.</div>
            <h2 id="dialog-title">Where does it go?</h2>
            <p id="dialog-copy">Steer each falling purchase into the wants or needs chute. You can only miss three.</p>
            <button class="primary-button" id="start-button" type="button">Start sorting</button>
          </div>
        </div>
      </div>

      <div class="controls">
        <div class="control-hint"><span class="key">←</span><span class="key">→</span> or <span class="key">A</span><span class="key">D</span><span>to steer</span></div>
        <div class="steer-controls" aria-label="Touch steering controls">
          <button class="steer-button" id="left-button" type="button" aria-label="Steer left">←</button>
          <button class="steer-button" id="right-button" type="button" aria-label="Steer right">→</button>
        </div>
      </div>
      <div class="footnote"><span>WANTS ← &nbsp;&nbsp; / &nbsp;&nbsp; → NEEDS</span><span>Three misses and you're out</span></div>
    </section>
  </main>

  <script>
    'use strict';

    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    const overlay = document.querySelector('#overlay');
    const startButton = document.querySelector('#start-button');
    const scoreDisplay = document.querySelector('#score');
    const streakDisplay = document.querySelector('#streak');
    const livesDisplay = document.querySelector('#lives');
    const dialogTag = document.querySelector('#dialog-tag');
    const dialogTitle = document.querySelector('#dialog-title');
    const dialogCopy = document.querySelector('#dialog-copy');
    const width = canvas.width;
    const height = canvas.height;
    const chuteLine = 515;
    const purchases = [
      { label: 'Rent', type: 'need' },
      { label: 'Movie tickets', type: 'want' },
      { label: 'Groceries', type: 'need' },
      { label: 'New sneakers', type: 'want' },
      { label: 'Bus pass', type: 'need' },
      { label: 'Game console', type: 'want' },
      { label: 'Medicine', type: 'need' },
      { label: 'Takeout', type: 'want' },
      { label: 'Electric bill', type: 'need' },
      { label: 'Concert ticket', type: 'want' },
      { label: 'Winter coat', type: 'need' },
      { label: 'Fancy coffee', type: 'want' },
      { label: 'Toothpaste', type: 'need' },
      { label: 'Streaming plan', type: 'want' },
      { label: 'Phone bill', type: 'need' },
      { label: 'New headphones', type: 'want' },
      { label: 'Fresh produce', type: 'need' },
      { label: 'Designer bag', type: 'want' },
      { label: 'Home supplies', type: 'need' },
      { label: 'Weekend trip', type: 'want' },
      { label: 'Work shoes', type: 'need' },
      { label: 'Snack delivery', type: 'want' },
      { label: 'Water bill', type: 'need' },
      { label: 'New phone case', type: 'want' }
    ];
    const held = { left: false, right: false };
    const particles = [];
    let state = 'ready';
    let score = 0;
    let streak = 0;
    let misses = 0;
    let cube = null;
    let previousTime = 0;
    let lastPurchase = '';
    let feedback = '';
    let feedbackColor = '#202720';
    let feedbackTimer = 0;
    let shake = 0;

    function nextPurchase() {
      let purchase;
      do {
        purchase = purchases[Math.floor(Math.random() * purchases.length)];
      } while (purchase.label === lastPurchase);
      lastPurchase = purchase.label;
      cube = { ...purchase, x: 500, y: -75, rotation: (Math.random() - 0.5) * 0.12 };
    }

    function startGame() {
      score = 0;
      streak = 0;
      misses = 0;
      lastPurchase = '';
      feedback = '';
      updateStats();
      nextPurchase();
      state = 'playing';
      previousTime = performance.now();
      overlay.hidden = true;
    }

    function endGame() {
      state = 'over';
      overlay.hidden = false;
      dialogTag.textContent = score > 0 ? 'Nice sorting out there' : 'The chute got the better of you';
      dialogTitle.textContent = `${score} sorted`;
      dialogCopy.textContent = score >= 15
        ? 'Sharp eye. You sorted a whole lot of wants from needs.'
        : 'Wants are extras. Needs are the essentials. Give it another run?';
      startButton.textContent = 'Play again';
    }

    function updateStats() {
      scoreDisplay.textContent = String(score).padStart(2, '0');
      streakDisplay.textContent = String(streak).padStart(2, '0');
      livesDisplay.textContent = `${'●'.repeat(3 - misses)}${'○'.repeat(misses)}`;
      livesDisplay.setAttribute('aria-label', `${3 - misses} misses remaining`);
    }

    function resolveCube() {
      const chute = cube.x < width / 2 ? 'want' : 'need';
      if (chute === cube.type) {
        score += 1;
        streak += 1;
        feedback = streak > 1 ? `Nice catch!  ×${streak}` : 'Right on!';
        feedbackColor = '#387c58';
        burst(cube.x, chuteLine, '#d5e96d');
      } else {
        misses += 1;
        streak = 0;
        feedback = `Oops! ${cube.type === 'want' ? 'That was a want' : 'That was a need'}`;
        feedbackColor = '#ee7155';
        shake = 9;
      }
      updateStats();
      feedbackTimer = 1.05;
      if (misses >= 3) {
        endGame();
      } else {
        nextPurchase();
      }
    }

    function burst(x, y, color) {
      for (let index = 0; index < 12; index += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 55 + Math.random() * 150;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 40, life: .45 + Math.random() * .35, color, size: 3 + Math.random() * 4 });
      }
    }

    function drawBackground(time) {
      ctx.fillStyle = '#e8e3d7';
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(63, 70, 59, .055)';
      for (let y = 24; y < chuteLine - 25; y += 28) {
        for (let x = 24 + ((y / 28) % 2) * 14; x < width; x += 28) {
          ctx.fillRect(x, y, 1.5, 1.5);
        }
      }

      ctx.fillStyle = 'rgba(238, 113, 85, .08)';
      ctx.fillRect(0, 0, width / 2, chuteLine);
      ctx.fillStyle = 'rgba(56, 124, 88, .08)';
      ctx.fillRect(width / 2, 0, width / 2, chuteLine);

      ctx.setLineDash([8, 10]);
      ctx.strokeStyle = 'rgba(32, 39, 32, .22)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(width / 2, 0);
      ctx.lineTo(width / 2, chuteLine - 12);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = 'rgba(32, 39, 32, .35)';
      ctx.font = '500 12px "DM Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('WANTS', width / 4, 33);
      ctx.fillText('NEEDS', width * 3 / 4, 33);

      drawChute(0, '#ee7155', '#cf5b44', time);
      drawChute(width / 2, '#387c58', '#286544', time);
    }

    function drawChute(x, color, darkColor, time) {
      const y = chuteLine;
      const chuteWidth = width / 2;
      ctx.fillStyle = darkColor;
      ctx.fillRect(x, y, chuteWidth, height - y);
      ctx.fillStyle = color;
      ctx.fillRect(x, y + 9, chuteWidth, height - y - 9);
      ctx.fillStyle = 'rgba(32, 39, 32, .15)';
      const travel = (time * 70) % 40;
      for (let stripe = -1; stripe < 14; stripe += 1) {
        const stripeX = x + stripe * 40 + travel;
        ctx.save();
        ctx.translate(stripeX, y + 9);
        ctx.transform(1, 0, -.35, 1, 0, 0);
        ctx.fillRect(0, 0, 9, height - y);
        ctx.restore();
      }
      ctx.strokeStyle = darkColor;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(x + 8, y + 8);
      ctx.lineTo(x + chuteWidth - 8, y + 8);
      ctx.stroke();
    }

    function drawCube() {
      if (!cube) return;
      const cubeWidth = 196;
      const cubeHeight = 94;
      const x = cube.x;
      const y = cube.y;
      const bob = Math.sin(performance.now() / 175) * 2;
      ctx.save();
      ctx.translate(x, y + bob);
      ctx.rotate(cube.rotation);
      ctx.shadowColor = 'rgba(32, 39, 32, .2)';
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 7;
      ctx.fillStyle = '#f9f5e9';
      ctx.strokeStyle = '#202720';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(-cubeWidth / 2, -cubeHeight / 2, cubeWidth, cubeHeight, 3);
      ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.stroke();
      ctx.fillStyle = cube.type === 'want' ? '#ee7155' : '#387c58';
      ctx.fillRect(-cubeWidth / 2, -cubeHeight / 2, 9, cubeHeight);
      ctx.fillStyle = '#72766c';
      ctx.font = '500 10px "DM Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('PURCHASE', 4, -14);
      ctx.fillStyle = '#202720';
      ctx.font = `700 ${cube.label.length > 15 ? 17 : 21}px "Space Grotesk", sans-serif`;
      ctx.fillText(cube.label, 4, 17);
      ctx.fillStyle = cube.type === 'want' ? '#ee7155' : '#387c58';
      ctx.beginPath();
      ctx.arc(cubeWidth / 2 - 19, -cubeHeight / 2 + 18, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawParticles(delta) {
      for (let index = particles.length - 1; index >= 0; index -= 1) {
        const particle = particles[index];
        particle.x += particle.vx * delta;
        particle.y += particle.vy * delta;
        particle.vy += 260 * delta;
        particle.life -= delta;
        if (particle.life <= 0) {
          particles.splice(index, 1);
          continue;
        }
        ctx.globalAlpha = Math.min(1, particle.life * 2);
        ctx.fillStyle = particle.color;
        ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
      }
      ctx.globalAlpha = 1;
    }

    function drawFeedback(delta) {
      if (feedbackTimer <= 0) return;
      feedbackTimer -= delta;
      ctx.globalAlpha = Math.min(1, feedbackTimer * 2);
      ctx.fillStyle = feedbackColor;
      ctx.font = '700 16px "Space Grotesk", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(feedback, width / 2, 76 - Math.max(0, 1 - feedbackTimer) * 9);
      ctx.globalAlpha = 1;
    }

    function frame(time) {
      const delta = Math.min((time - previousTime) / 1000 || 0, .04);
      previousTime = time;
      if (state === 'playing' && cube) {
        const steering = Number(held.right) - Number(held.left);
        cube.x = Math.max(92, Math.min(width - 92, cube.x + steering * 390 * delta));
        cube.y += (168 + Math.min(score, 35) * 4) * delta;
        if (cube.y >= chuteLine - 35) resolveCube();
      }
      if (shake > 0) shake = Math.max(0, shake - 30 * delta);

      ctx.save();
      if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
      drawBackground(time / 1000);
      drawCube();
      drawParticles(delta);
      drawFeedback(delta);
      ctx.restore();
      requestAnimationFrame(frame);
    }

    function steerFromKey(event, pressed) {
      const key = event.key.toLowerCase();
      if (['arrowleft', 'arrowright', 'a', 'd'].includes(key)) event.preventDefault();
      if (key === 'arrowleft' || key === 'a') held.left = pressed;
      if (key === 'arrowright' || key === 'd') held.right = pressed;
    }

    function bindSteeringButton(button, direction) {
      button.addEventListener('pointerdown', event => {
        event.preventDefault();
        held[direction] = true;
        button.setPointerCapture(event.pointerId);
      });
      const release = () => { held[direction] = false; };
      button.addEventListener('pointerup', release);
      button.addEventListener('pointercancel', release);
      button.addEventListener('lostpointercapture', release);
    }

    window.addEventListener('keydown', event => steerFromKey(event, true));
    window.addEventListener('keyup', event => steerFromKey(event, false));
    window.addEventListener('blur', () => { held.left = false; held.right = false; });
    startButton.addEventListener('click', startGame);
    bindSteeringButton(document.querySelector('#left-button'), 'left');
    bindSteeringButton(document.querySelector('#right-button'), 'right');

    previousTime = performance.now();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
